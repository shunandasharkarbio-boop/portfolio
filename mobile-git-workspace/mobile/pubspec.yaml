name: mobile_git_workspace
description: "Mobile Git Workspace - Manage GitHub repos and upload files from your smartphone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  file_picker: ^8.0.0
  shared_preferences: ^2.2.0
  flutter_markdown: ^0.7.1
  flutter_highlight: ^0.7.0
  url_launcher: ^6.2.5
  google_fonts: ^6.1.0
  intl: ^0.19.0
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
